<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hiring path — airport catering (SleekFlow)</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-elevated: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #5c5c5c;
      --text-tertiary: #8a8a8a;
      --text-quaternary: #b0b0b0;
      --stroke: #d4d4d4;
      --stroke-soft: #e8e8e8;
      --fill: #f0f0f0;
      --fill-soft: #f5f5f5;
      --fill-muted: #fafafa;
      --green: #2e7d4f;
      --green-soft: #e8f5ee;
      --orange: #c45c26;
      --yellow: #b8860b;
      --blue: #2f5d9f;
      --purple: #6b4ea2;
      --red: #b33a3a;
      --radius: 8px;
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
    }
    button { font-family: inherit; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; }
    h2 { font-size: 18px; margin: 0; font-weight: 700; }
    .sub { color: var(--text-secondary); margin: 0 0 20px; }
    .muted { color: var(--text-secondary); font-size: 13px; }
    .tiny { color: var(--text-tertiary); font-size: 12px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .print-btn {
      padding: 8px 14px; border-radius: var(--radius);
      border: 1px solid var(--stroke); background: var(--fill-soft);
      cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .print-btn:hover { background: var(--fill); }

    .tabs {
      display: flex; gap: 6px;
      border-bottom: 1px solid var(--stroke);
    }
    .tab {
      padding: 10px 18px;
      border: 1px solid var(--stroke);
      border-bottom: 1px solid var(--stroke);
      border-radius: var(--radius) var(--radius) 0 0;
      background: var(--fill);
      margin-bottom: -1px;
      cursor: pointer;
      font-size: 13px;
    }
    .tab.active {
      background: var(--bg);
      border-bottom-color: var(--bg);
      font-weight: 600;
    }

    .sheet {
      border: 1px solid var(--stroke);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--stroke-soft);
      background: var(--fill-muted);
    }
    .card.green { border: 2px solid var(--green); background: var(--green-soft); }
    .card.yellow { border: 2px solid var(--yellow); }
    .card strong { display: block; margin-bottom: 8px; }

    .callout {
      padding: 12px 14px;
      border-radius: var(--radius);
      border-left: 4px solid var(--blue);
      background: var(--fill-soft);
      font-size: 13px;
    }
    .callout.warn { border-left-color: var(--yellow); }
    .callout.danger { border-left-color: var(--red); }
    .callout .t { font-weight: 700; margin-bottom: 4px; }

    .score-title { font-weight: 600; margin-bottom: 10px; }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .score-card {
      padding: 16px 12px;
      border-radius: var(--radius);
      border: 2px solid;
      text-align: center;
      background: var(--fill-muted);
    }
    .score-card .n {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .score-card .l { font-size: 13px; font-weight: 600; }

    .path-rows { display: flex; flex-direction: column; gap: 16px; }
    .path-row {
      display: flex; justify-content: center; align-items: flex-start;
      flex-wrap: wrap; gap: 0;
    }
    .step-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; width: 100px; padding: 0; border: none;
      background: transparent; cursor: pointer; color: inherit;
    }
    .circle {
      width: 56px; height: 56px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      background: var(--fill); border: 3px solid; font-size: 20px; font-weight: 600;
    }
    .circle.active { background: var(--green); border-color: var(--green) !important; color: #fff; }
    .step-title { font-size: 12px; font-weight: 500; text-align: center; color: var(--text-secondary); }
    .step-btn.active .step-title { font-weight: 600; color: var(--text); }
    .step-tag { font-size: 10px; font-weight: 600; }
    .arrow {
      width: 24px; height: 56px; display: flex; align-items: center;
      justify-content: center; color: var(--text-quaternary); font-size: 18px;
    }

    hr.div {
      border: none; border-top: 1px solid var(--stroke-soft); margin: 0;
    }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--stroke); background: var(--fill-soft);
    }
    .pill.ok { border-color: var(--green); color: var(--green); background: var(--green-soft); }
    .pill.warn { border-color: var(--yellow); color: var(--yellow); }
    .swatch {
      width: 10px; height: 10px; border-radius: 2px; display: inline-block;
    }

    .nav-btn {
      padding: 8px 14px; border-radius: var(--radius);
      border: 1px solid var(--stroke); background: var(--bg);
      cursor: pointer; font-size: 13px;
    }
    .nav-btn.primary {
      background: var(--green); color: #fff; border-color: var(--green); font-weight: 600;
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .spacer { flex: 1; min-width: 8px; }

    .hpanel {
      display: flex; flex-direction: row;
      border: 1px solid var(--stroke-soft);
      border-left-width: 4px;
      border-radius: var(--radius);
      background: var(--fill-muted);
      overflow: hidden;
    }
    .hpanel > div {
      flex: 1; padding: 14px 16px; min-width: 0;
      border-right: 1px solid var(--stroke-soft);
    }
    .hpanel > div:last-child { border-right: none; }
    .hpanel .lab { font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px; }
    .hpanel .val { font-size: 13px; font-weight: 600; }

    .how-box, .effort-box, .why-box {
      padding: 14px; border-radius: var(--radius);
      border: 1px solid var(--stroke-soft); background: var(--fill-muted);
    }
    .effort-box { border-width: 2px; }
    .effort-box .lab, .why-box .lab, .how-box .lab {
      font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;
    }
    .effort-box .val, .why-box .val, .how-box .val { font-weight: 600; font-size: 13px; }

    .views {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .views { grid-template-columns: 1fr; }
      .score-grid { grid-template-columns: repeat(2, 1fr); }
      .hpanel { flex-direction: column; }
      .hpanel > div { border-right: none; border-bottom: 1px solid var(--stroke-soft); }
    }

    .phone {
      max-width: 300px; margin: 0 auto; width: 100%;
      border: 2px solid var(--stroke); border-radius: 28px;
      background: var(--bg-elevated); padding: 10px;
    }
    .notch {
      height: 14px; display: flex; justify-content: center; align-items: center; margin-bottom: 8px;
    }
    .notch span {
      width: 56px; height: 6px; border-radius: 999px; background: var(--fill);
    }
    .screen {
      border-radius: 18px; background: var(--fill-muted);
      border: 1px solid var(--stroke-soft); padding: 10px; min-height: 280px;
    }
    .screen .cap {
      text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 10px;
    }
    .bubbles { display: flex; flex-direction: column; gap: 6px; }
    .bubble-row { display: flex; }
    .bubble-row.mine { justify-content: flex-end; }
    .bubble-row.theirs { justify-content: flex-start; }
    .bubble {
      max-width: 92%; padding: 7px 10px; border-radius: 12px;
      border: 1px solid var(--stroke-soft); font-size: 13px;
      background: var(--bg);
    }
    .bubble.mine { background: var(--green); color: #fff; border-color: var(--green); }
    .bubble.template { background: var(--fill-soft); border: 2px solid var(--orange); }
    .bubble.agent { background: var(--fill-soft); }
    .bubble .who { font-size: 11px; color: var(--text-tertiary); }

    .console {
      border: 1px solid var(--stroke); border-radius: var(--radius);
      background: var(--bg-elevated); overflow: hidden; min-height: 260px;
    }
    .console-head {
      padding: 10px 12px; border-bottom: 1px solid var(--stroke-soft);
      background: var(--fill); font-size: 13px; font-weight: 600;
    }
    .console-grid {
      display: grid; grid-template-columns: 1.2fr 1.3fr 1fr;
      padding: 8px 12px; border-bottom: 1px solid var(--stroke-soft);
      font-size: 12px; color: var(--text-tertiary);
    }
    .console-row {
      display: grid; grid-template-columns: 1.2fr 1.3fr 1fr;
      padding: 10px 12px; border-bottom: 1px solid var(--stroke-soft);
      font-size: 13px; align-items: center;
    }
    .console-row strong { font-weight: 600; }

    @media print {
      .toolbar, .print-btn { display: none !important; }
      .wrap { max-width: none; padding: 0; }
      .tab:not(.active) { display: none; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div>
        <h1>Hiring path — airport catering</h1>
        <p class="sub" style="margin:0">One team under the same lead. Current process vs two SleekFlow options.</p>
      </div>
      <button class="print-btn" type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="sheet" id="app"></div>
  </div>

  <script>
    const STEPS = [
      {
        id: "apply", n: 1, title: "Apply", who: "Candidate",
        what: "Share name, phone, job interest.",
        needs: "Fast form + contact record.",
        pain: "volume", whyPain: "Same apply task × hundreds of people.",
        todayHow: "Candidate WhatsApps the team. Staff ask details one by one and type into a sheet.",
        opt1How: "Candidate scans QR / taps link and writes first. Bot collects data while they are chatting (inbound — not team outreach).",
        opt2How: "Same as Option 1 — candidate starts; SleekFlow bot collects apply data.",
        effortOpt1: "down", effortOpt2: "down",
        noteOpt1: "Only step where the candidate opens the chat. No template fee for this inbound apply.",
        noteOpt2: "This is where Option 2 still uses SleekFlow (mass data in).",
        opt1Outreach: false,
        currentChat: [
          { from: "user", text: "Hi, saw the catering job at airport" },
          { from: "agent", text: "Hi! Can I have your full name?" },
          { from: "user", text: "Alex Chan" },
          { from: "agent", text: "Phone number + which role?" },
          { from: "user", text: "9123 4567, kitchen helper" },
          { from: "agent", text: "OK noted. We’ll message if shortlisted." }
        ],
        opt1Chat: [
          { from: "user", text: "Hi, I want to apply (from QR)" },
          { from: "bot", text: "Welcome! Your full name?" },
          { from: "user", text: "Alex Chan" },
          { from: "bot", text: "Role preference?" },
          { from: "bot", text: "Thanks — application received." }
        ],
        opt2Chat: [
          { from: "user", text: "Hi, I want to apply" },
          { from: "bot", text: "SleekFlow bot: full name?" },
          { from: "user", text: "Alex Chan" },
          { from: "bot", text: "Phone + role?" },
          { from: "bot", text: "Saved. Team will follow up." }
        ],
        consoleRows: [
          { name: "Alex Chan", stage: "Applied", flag: "Inbound" },
          { name: "Mei Wong", stage: "Applied", flag: "Inbound" },
          { name: "Sam Lee", stage: "Applied", flag: "Inbound" }
        ]
      },
      {
        id: "screen", n: 2, title: "Screen & book", who: "Team",
        what: "Check fit. Book interview slot.",
        needs: "Basic screen + interview time.",
        pain: "volume", whyPain: "Same booking/reminder loop for everyone.",
        todayHow: "Team scrolls the chat list, asks availability, books by hand, then reminds again later.",
        opt1How: "Team outreach → paid template to book (and again for day-before reminder). After they reply, bot/team can continue inside the new window.",
        opt2How: "SleekFlow keeps the apply record. Scheduling / reminders move to 2nd phone.",
        effortOpt1: "down", effortOpt2: "trade",
        noteOpt1: "Assume beyond 24h — every book / remind starts with a paid template.",
        noteOpt2: "Mass profile in SF. Booking on 2nd phone ≈ today’s effort after step 1.",
        opt1Outreach: true,
        care: "Map photo of interview place.",
        currentChat: [
          { from: "agent", text: "Alex, free for interview Tue or Wed?" },
          { from: "user", text: "Tue morning OK" },
          { from: "agent", text: "Tue 10:00 at staff entrance." },
          { from: "agent", text: "(Next day) Reminder — tomorrow 10:00, bring ID" },
          { from: "user", text: "OK see you" }
        ],
        opt1Chat: [
          { from: "template", text: "TEMPLATE (paid): Book interview — [Tue 10:00] [Wed 14:00]" },
          { from: "user", text: "Tue 10:00" },
          { from: "bot", text: "Booked. Venue tip coming after you reply." },
          { from: "template", text: "TEMPLATE (paid): Reminder — interview tomorrow 10:00. Reply YES" },
          { from: "user", text: "YES" },
          { from: "bot", text: "See you tomorrow. Map below." }
        ],
        opt2Chat: [
          { from: "bot", text: "SF: shortlisted — team will WhatsApp you" },
          { from: "agent", text: "(2nd phone) Hi Alex, interview Tue 10:00?" },
          { from: "user", text: "Yes" },
          { from: "agent", text: "(2nd phone) Reminder tomorrow + map" }
        ],
        consoleRows: [
          { name: "Alex Chan", stage: "Interview booked", flag: "Tue 10:00" },
          { name: "Mei Wong", stage: "Needs reminder", flag: "Template" },
          { name: "Sam Lee", stage: "No reply", flag: "Chase" }
        ]
      },
      {
        id: "interview", n: 3, title: "Interview", who: "Team",
        what: "Meet face to face. Pass or not.",
        needs: "Human talk + same-day result message.",
        pain: "tailored", whyPain: "Each person needs a real conversation.",
        todayHow: "In-person interview. Result messaged on the same personal WhatsApp thread.",
        opt1How: "Interview is human. Result / next-step message is team outreach → paid template, then bot/team continues after they reply.",
        opt2How: "Interview + result all on 2nd phone. SleekFlow not used from here.",
        effortOpt1: "same", effortOpt2: "same",
        noteOpt1: "Bot does not interview. Result ping still costs a template under our assumption.",
        noteOpt2: "Same human effort as today — different phone number.",
        opt1Outreach: true,
        sfLimit: "SleekFlow cannot run the interview itself.",
        currentChat: [
          { from: "agent", text: "Thanks for coming today Alex" },
          { from: "agent", text: "You passed. Next we’ll need your ID photo" },
          { from: "user", text: "Thank you! When do I send?" },
          { from: "agent", text: "You can send here now" }
        ],
        opt1Chat: [
          { from: "template", text: "TEMPLATE (paid): Interview result — Passed. Reply OK for next steps" },
          { from: "user", text: "OK" },
          { from: "bot", text: "Please send a clear ID photo next." }
        ],
        opt2Chat: [
          { from: "agent", text: "(2nd phone) Thanks for coming — you passed" },
          { from: "agent", text: "(2nd phone) Please send ID photo here" },
          { from: "user", text: "OK" }
        ],
        consoleRows: [
          { name: "Alex Chan", stage: "Interview pass", flag: "Same day" },
          { name: "Mei Wong", stage: "Interview fail", flag: "Closed" },
          { name: "Sam Lee", stage: "Interview today", flag: "In person" }
        ]
      },
      {
        id: "confirm", n: 4, title: "More info", who: "Candidate",
        what: "Send ID and personal details.",
        needs: "Guided photo upload + help if stuck.",
        pain: "both", whyPain: "Mass chase + one-to-one help when stuck.",
        todayHow: "Team chases ID/docs in the same chat, repeatedly.",
        opt1How: "Doc chase is team outreach → paid template to ask for ID / emergency contact. After reply, bot guides upload; team helps if stuck.",
        opt2How: "All doc chase on 2nd phone — same pattern as today.",
        effortOpt1: "down", effortOpt2: "same",
        noteOpt1: "Assume beyond 24h — each chase starts with a paid template.",
        noteOpt2: "No SleekFlow help here — effort ≈ current process.",
        opt1Outreach: true,
        currentChat: [
          { from: "agent", text: "Can you send a clear photo of your ID?" },
          { from: "user", text: "Is this OK?" },
          { from: "agent", text: "Too blurry — hold flat under light" },
          { from: "user", text: "[photo]" },
          { from: "agent", text: "Got it. Emergency contact too please" }
        ],
        opt1Chat: [
          { from: "template", text: "TEMPLATE (paid): Please send ID photo. Reply READY" },
          { from: "user", text: "READY" },
          { from: "bot", text: "Hold ID flat under light, then send photo." },
          { from: "user", text: "[photo]" },
          { from: "template", text: "TEMPLATE (paid): Still need emergency contact. Reply HELP" },
          { from: "user", text: "HELP" },
          { from: "agent", text: "Send name + phone of emergency contact." }
        ],
        opt2Chat: [
          { from: "agent", text: "(2nd phone) Please send ID photo" },
          { from: "user", text: "[photo]" },
          { from: "agent", text: "(2nd phone) Emergency contact name + number?" },
          { from: "user", text: "Pat Chan 9876 5432" }
        ],
        consoleRows: [
          { name: "Alex Chan", stage: "Docs complete", flag: "OK" },
          { name: "Sam Lee", stage: "Docs missing", flag: "Template chase" },
          { name: "Priya N.", stage: "Needs help", flag: "Inbox" }
        ]
      },
      {
        id: "permit", n: 5, title: "Airport permit", who: "Team + Airport",
        what: "Submit airport permit pack.",
        needs: "Status updates while waiting.",
        pain: "volume", whyPain: "Same status chase, many candidates.",
        todayHow: "Team files pack offline; types status updates into chats when candidates ask.",
        opt1How: "Status updates are team outreach → paid Utility template. After they reply, bot/team can answer FAQ.",
        opt2How: "Filing same as today; status replies on 2nd phone when asked.",
        effortOpt1: "trade", effortOpt2: "same",
        noteOpt1: "Template cost for each status ping; less typing after they reply.",
        noteOpt2: "Same manual status work as today on 2nd phone.",
        opt1Outreach: true,
        loop: "Bad docs → back to step 4.",
        sfLimit: "Airport portal filing stays with the team.",
        currentChat: [
          { from: "user", text: "Any update on my airport permit?" },
          { from: "agent", text: "Submitted last week — still in review, normal" },
          { from: "user", text: "How long usually?" },
          { from: "agent", text: "Often 1–3 weeks. I’ll message when approved" }
        ],
        opt1Chat: [
          { from: "template", text: "TEMPLATE (paid): Permit submitted. Still in review. Reply 1 for FAQ" },
          { from: "user", text: "1" },
          { from: "bot", text: "Typical wait 1–3 weeks. We’ll update you." }
        ],
        opt2Chat: [
          { from: "user", text: "(2nd phone) Any permit update?" },
          { from: "agent", text: "(2nd phone) Still in review — normal wait" },
          { from: "agent", text: "(2nd phone) Will tell you when approved" }
        ],
        consoleRows: [
          { name: "Alex Chan", stage: "Permit submitted", flag: "Template ping" },
          { name: "Sam Lee", stage: "Permit returned", flag: "Fix docs" },
          { name: "Priya N.", stage: "Permit approved", flag: "Next test" }
        ]
      },
      {
        id: "book-test", n: 6, title: "Book test", who: "Team",
        what: "Book airport authority test.",
        needs: "Slot + venue photo + what to bring.",
        pain: "volume", whyPain: "Many bookings and “where do I go?” messages.",
        todayHow: "Team messages each person to pick a slot and sends venue photo by hand.",
        opt1How: "Book + day-before reminder are both paid templates. After they reply, bot confirms slot and can send map.",
        opt2How: "All booking / venue guidance on 2nd phone — same as today.",
        effortOpt1: "trade", effortOpt2: "same",
        noteOpt1: "Two template costs typical (book + remind); less typing after.",
        noteOpt2: "No SF automation — effort ≈ current.",
        opt1Outreach: true,
        care: "Day-before venue reminder.",
        currentChat: [
          { from: "agent", text: "Permit approved! Test Fri 09:00 or Mon 11:00?" },
          { from: "user", text: "Fri 09:00" },
          { from: "agent", text: "OK. Bring ID. Venue photo:" },
          { from: "agent", text: "[test centre photo]" },
          { from: "agent", text: "(Day before) Reminder tomorrow 09:00" }
        ],
        opt1Chat: [
          { from: "template", text: "TEMPLATE (paid): Permit OK. Book test: [Fri 09:00] [Mon 11:00]" },
          { from: "user", text: "Fri 09:00" },
          { from: "bot", text: "Confirmed. Venue photo + bring ID." },
          { from: "template", text: "TEMPLATE (paid): Reminder — test tomorrow 09:00" }
        ],
        opt2Chat: [
          { from: "agent", text: "(2nd phone) Test Fri 09:00 or Mon 11:00?" },
          { from: "user", text: "Fri 09:00" },
          { from: "agent", text: "(2nd phone) Venue photo + bring ID" }
        ],
        consoleRows: [
          { name: "Priya N.", stage: "Test booked", flag: "Fri 09:00" },
          { name: "Alex Chan", stage: "Needs outreach", flag: "Template" },
          { name: "Sam Lee", stage: "Docs fix", flag: "Blocked" }
        ]
      },
      {
        id: "pass-test", n: 7, title: "Pass test", who: "Candidate",
        what: "Take test. Retry until pass.",
        needs: "Fast rebook + encourage message.",
        pain: "both", whyPain: "Retries = more volume + personal care.",
        todayHow: "Fail → team rebooks and encourages in the same chat.",
        opt1How: "Fail / rebook message is team outreach → paid template. After reply, bot confirms next slot.",
        opt2How: "Fail / rebook / encourage all on 2nd phone.",
        effortOpt1: "down", effortOpt2: "same",
        noteOpt1: "Template → reply → bot. Extra Meta cost per retry outreach.",
        noteOpt2: "Same retry manpower as today.",
        opt1Outreach: true,
        loop: "Fail → step 6 again.",
        care: "Do not leave them waiting after a fail.",
        sfLimit: "Test itself is run by airport authority.",
        currentChat: [
          { from: "agent", text: "Not this time — want Mon 11:00 rebook?" },
          { from: "user", text: "Yes please" },
          { from: "agent", text: "Done. Bring ID, arrive 30 min early" }
        ],
        opt1Chat: [
          { from: "template", text: "TEMPLATE (paid): Not this time. Rebook Mon 11:00? Reply YES" },
          { from: "user", text: "YES" },
          { from: "bot", text: "Booked. Prep tips: ID + arrive early." }
        ],
        opt2Chat: [
          { from: "agent", text: "(2nd phone) Not this time — Mon 11:00?" },
          { from: "user", text: "OK" },
          { from: "agent", text: "(2nd phone) Booked. Arrive early, bring ID" }
        ],
        consoleRows: [
          { name: "Priya N.", stage: "Test pass", flag: "Attempt 1" },
          { name: "Alex Chan", stage: "Test rebook", flag: "Template" },
          { name: "Jordan K.", stage: "Test fail", flag: "Encourage" }
        ]
      },
      {
        id: "verbal", n: 8, title: "Verbal offer", who: "Team",
        what: "Call to offer the job.",
        needs: "Phone call + short written summary.",
        pain: "tailored", whyPain: "Pay, shift, start date are personal.",
        todayHow: "Call first, then type a short WhatsApp summary in the same thread.",
        opt1How: "Call is human. Written offer summary is team outreach → paid template; after ACCEPT, bot confirms welcome.",
        opt2How: "Call + summary on 2nd phone — same as today.",
        effortOpt1: "same", effortOpt2: "same",
        noteOpt1: "Call stays with the team; WhatsApp summary still needs a template.",
        noteOpt2: "No effort change vs current.",
        opt1Outreach: true,
        sfLimit: "Verbal offer call stays with the team.",
        currentChat: [
          { from: "agent", text: "Following our call — kitchen helper, AM shift" },
          { from: "agent", text: "Start next Monday if OK?" },
          { from: "user", text: "Yes I accept, thank you" },
          { from: "agent", text: "Great — we’ll guide you for day 1" }
        ],
        opt1Chat: [
          { from: "agent", text: "(Call done)" },
          { from: "template", text: "TEMPLATE (paid): Offer summary — AM shift, start Mon. Reply ACCEPT" },
          { from: "user", text: "ACCEPT" },
          { from: "bot", text: "Welcome — day-1 guide comes later." }
        ],
        opt2Chat: [
          { from: "agent", text: "(2nd phone) After call: AM shift, start Mon" },
          { from: "user", text: "I accept" }
        ],
        consoleRows: [
          { name: "Priya N.", stage: "Verbal accepted", flag: "Start Mon" },
          { name: "Alex Chan", stage: "Verbal pending", flag: "Call today" },
          { name: "Jordan K.", stage: "Test pass", flag: "Ready" }
        ]
      },
      {
        id: "day1", n: 9, title: "First day", who: "Team",
        what: "Arrive. Get paper offer on site.",
        needs: "Morning contact + map + supervisor phone.",
        pain: "tailored", whyPain: "Each person must find the venue.",
        todayHow: "Team messages/calls each starter in the morning with meeting point.",
        opt1How: "7am day-1 message is team outreach → paid template (map + supervisor). If they reply, bot/team can help find the gate.",
        opt2How: "Morning reach-out on 2nd phone — same care duty as today.",
        effortOpt1: "down", effortOpt2: "same",
        noteOpt1: "Must budget a template for every day-1 wake-up.",
        noteOpt2: "Same morning manpower as current process.",
        opt1Outreach: true,
        care: "Must reach them on morning of day 1.",
        sfLimit: "Paper offer is handed at the venue.",
        currentChat: [
          { from: "agent", text: "Good morning! Today is day 1" },
          { from: "agent", text: "Meet Gate A staff entrance. Supervisor Pat 9123 4567" },
          { from: "agent", text: "[meeting point photo]" },
          { from: "user", text: "On my way" },
          { from: "agent", text: "Message me if you can’t find it" }
        ],
        opt1Chat: [
          { from: "template", text: "TEMPLATE 7am (paid): Day 1 — Gate A. Pat 9123 4567. Reply OK" },
          { from: "template", text: "[meeting point photo in template]" },
          { from: "user", text: "OK" },
          { from: "bot", text: "Great — message here if you can’t find Gate A." }
        ],
        opt2Chat: [
          { from: "agent", text: "(2nd phone) Morning! Day 1 — Gate A" },
          { from: "agent", text: "(2nd phone) Pat 9123 4567 + photo" },
          { from: "user", text: "On my way" }
        ],
        consoleRows: [
          { name: "Priya N.", stage: "Day-1 check-in", flag: "Replied" },
          { name: "Alex Chan", stage: "Day-1 no reply", flag: "Call now" },
          { name: "Jordan K.", stage: "Starts tomorrow", flag: "Queued" }
        ]
      }
    ];

    const PAIN = {
      volume: { label: "Mass & repetitive", color: "var(--orange)" },
      tailored: { label: "Tailor-made", color: "var(--blue)" },
      both: { label: "Both", color: "var(--purple)" }
    };
    const EFFORT = {
      down: { label: "Less team effort", color: "var(--green)" },
      same: { label: "Same team effort", color: "var(--stroke)" },
      up: { label: "More team effort", color: "var(--orange)" },
      trade: { label: "Trade-off", color: "var(--yellow)" }
    };

    let tab = "current";
    let stepN = 1;

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setTab(next) {
      tab = next;
      stepN = 1;
      render();
    }

    function setStep(n) {
      stepN = n;
      render();
    }

    function renderTabs() {
      const items = [
        { id: "current", label: "Current process" },
        { id: "opt1", label: "Option 1" },
        { id: "opt2", label: "Option 2" }
      ];
      document.getElementById("tabs").innerHTML = items.map((item) =>
        `<button type="button" class="tab ${tab === item.id ? "active" : ""}" data-tab="${item.id}">${esc(item.label)}</button>`
      ).join("");
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => setTab(btn.dataset.tab));
      });
    }

    function introHtml() {
      if (tab === "current") {
        return `
          <div class="card">
            <strong>Current process — full manual</strong>
            <div class="muted">One team under the same lead chats with candidates on WhatsApp. High typing and chase effort. No SleekFlow. No Meta template fees.</div>
          </div>
          <div class="callout"><div class="t">Phone view on this tab</div>Typical team ↔ candidate WhatsApp thread for that step.</div>`;
      }
      if (tab === "opt1") {
        return `
          <div class="card green">
            <strong>Option 1 — SleekFlow full path</strong>
            <div class="muted">Candidate can start the chat (apply via QR / link). After that, the team usually cannot reply inside Meta’s free 24-hour window for every person — so for this comparison we assume all team outreach (book, remind, result, chase, status, day-1) is beyond 24h and needs a paid Meta template. When the candidate replies, the bot/team can chat freely again until the next outreach.</div>
          </div>
          <div class="callout warn"><div class="t">Cost assumption for Option 1</div>Every team reach-out = template fee. Only inbound apply (step 1) is free of that fee.</div>`;
      }
      return `
        <div class="card yellow">
          <strong>Option 2 — SleekFlow only for steps 1–2 (mass data in)</strong>
          <div class="muted">SleekFlow for apply (+ early screening records). From interview — and likely scheduling / reminders — through first day, outreach is on another phone number to avoid Meta template fees.</div>
        </div>`;
    }

    function effortScoreHtml() {
      if (tab === "current") return "";
      const values = STEPS.map((s) => (tab === "opt1" ? s.effortOpt1 : s.effortOpt2));
      const count = (d) => values.filter((x) => x === d).length;
      const cards = [
        { key: "down", label: "Less effort", color: "var(--green)" },
        { key: "same", label: "Same", color: "var(--text-secondary)" },
        { key: "trade", label: "Trade-off", color: "var(--yellow)" },
        { key: "up", label: "More effort", color: "var(--orange)" }
      ];
      return `
        <div>
          <div class="score-title">Team manpower vs current · 9 steps</div>
          <div class="score-grid">
            ${cards.map((c) => `
              <div class="score-card" style="border-color:${c.color}">
                <div class="n" style="color:${c.color}">${count(c.key)}</div>
                <div class="l">${esc(c.label)}</div>
              </div>`).join("")}
          </div>
        </div>`;
    }

    function pathHtml() {
      const row = (list) => list.map((s, i) => {
        const active = s.n === stepN;
        const pain = PAIN[s.pain].color;
        const tag = tab === "opt2"
          ? `<span class="step-tag" style="color:${s.n <= 2 ? "var(--green)" : "var(--yellow)"}">${s.n <= 2 ? "SleekFlow" : "2nd phone"}</span>`
          : "";
        return `
          <button type="button" class="step-btn ${active ? "active" : ""}" data-step="${s.n}">
            <div class="circle ${active ? "active" : ""}" style="border-color:${pain}">${s.n}</div>
            <span class="step-title">${esc(s.title)}</span>
            ${tag}
          </button>
          ${i < list.length - 1 ? `<div class="arrow">→</div>` : ""}`;
      }).join("");

      return `
        <h2>Process map</h2>
        ${tab === "opt2" ? `<div class="tiny">Green label = SleekFlow · Yellow label = 2nd phone outreach</div>` : ""}
        <div class="path-rows">
          <div class="path-row">${row(STEPS.slice(0, 5))}</div>
          <div class="path-row">${row(STEPS.slice(5))}</div>
        </div>`;
    }

    function phoneHtml(lines, caption) {
      const bubbles = lines.map((line) => {
        const mine = line.from === "user";
        const isTemplate = line.from === "template";
        const agent = line.from === "agent";
        const label = mine ? "" : isTemplate ? "Template (paid)" : agent ? "Team" : "SleekFlow bot";
        const cls = mine ? "mine" : isTemplate ? "template" : agent ? "agent" : "";
        return `
          <div class="bubble-row ${mine ? "mine" : "theirs"}">
            <div class="bubble ${cls}">
              ${label ? `<div class="who">${esc(label)}</div>` : ""}
              ${esc(line.text)}
            </div>
          </div>`;
      }).join("");
      return `
        <div class="phone">
          <div class="notch"><span></span></div>
          <div class="screen">
            <div class="cap">${esc(caption)}</div>
            <div class="bubbles">${bubbles}</div>
          </div>
        </div>`;
    }

    function consoleHtml(title, rows) {
      return `
        <div class="console">
          <div class="console-head">${esc(title)}</div>
          <div class="console-grid"><div>Candidate</div><div>Stage</div><div>Flag</div></div>
          ${rows.map((r) => `
            <div class="console-row">
              <strong>${esc(r.name)}</strong>
              <div>${esc(r.stage)}</div>
              <div class="muted">${esc(r.flag)}</div>
            </div>`).join("")}
        </div>`;
    }

    function render() {
      renderTabs();
      const step = STEPS.find((s) => s.n === stepN) || STEPS[0];
      const idx = STEPS.findIndex((s) => s.n === step.n);
      const howText = tab === "current" ? step.todayHow : tab === "opt1" ? step.opt1How : step.opt2How;
      const howLabel = tab === "current" ? "How the team works today" : tab === "opt1" ? "How Option 1 works" : "How Option 2 works";
      const chat = tab === "current" ? step.currentChat : tab === "opt1" ? step.opt1Chat : step.opt2Chat;
      const chatCaption = tab === "current"
        ? "WhatsApp · Team ↔ Candidate"
        : tab === "opt1"
          ? "WhatsApp · Option 1"
          : step.n <= 2
            ? "WhatsApp · SleekFlow then handoff"
            : "WhatsApp · 2nd phone";
      const effort = tab === "opt1" ? step.effortOpt1 : step.effortOpt2;
      const note = tab === "opt1" ? step.noteOpt1 : step.noteOpt2;
      const consoleTitle = tab === "current"
        ? "Team tracking (today — chat list / sheet)"
        : tab === "opt1"
          ? "Team console · SleekFlow"
          : step.n <= 2
            ? "Team console · SleekFlow (early only)"
            : "Team tracking · 2nd phone / sheet";
      const consoleRows = tab === "current"
        ? [
            { name: "Alex Chan", stage: step.title, flag: "Manual chat" },
            { name: "Mei Wong", stage: step.title, flag: "Manual chat" },
            { name: "Sam Lee", stage: step.title, flag: "Manual chat" }
          ]
        : step.consoleRows;
      const pain = PAIN[step.pain];

      let pills = "";
      if (tab === "opt2") {
        pills += `<span class="pill ${step.n <= 2 ? "ok" : "warn"}">${step.n <= 2 ? "SleekFlow" : "2nd phone"}</span>`;
      }
      if (tab === "opt1") {
        pills += step.opt1Outreach
          ? `<span class="pill warn">Outreach = paid template</span>`
          : `<span class="pill ok">Inbound — no template</span>`;
      }

      document.getElementById("app").innerHTML = `
        ${introHtml()}
        ${effortScoreHtml()}
        ${pathHtml()}
        <hr class="div" />
        <div class="stack">
          <div class="row">
            <h2>Step ${step.n}: ${esc(step.title)}</h2>
            <span class="pill"><span class="swatch" style="background:${pain.color}"></span>${esc(pain.label)}</span>
            ${pills}
            <span class="spacer"></span>
            <button type="button" class="nav-btn" id="prev" ${idx <= 0 ? "disabled" : ""}>Previous</button>
            <button type="button" class="nav-btn primary" id="next" ${idx >= STEPS.length - 1 ? "disabled" : ""}>Next</button>
          </div>

          <div class="hpanel" style="border-left-color:${pain.color}">
            <div><div class="lab">What</div><div class="val">${esc(step.what)}</div></div>
            <div><div class="lab">Who</div><div class="val">${esc(step.who)}</div></div>
            <div><div class="lab">Needs</div><div class="val">${esc(step.needs)}</div></div>
            <div><div class="lab">Pain</div><div class="val">${esc(step.whyPain)}</div></div>
          </div>

          <div class="how-box">
            <div class="lab">${esc(howLabel)}</div>
            <div class="val">${esc(howText)}</div>
          </div>

          ${tab !== "current" ? `
            <div class="effort-box" style="border-color:${EFFORT[effort].color}">
              <div class="lab">Team manpower vs current</div>
              <div class="val">${esc(EFFORT[effort].label)}</div>
            </div>
            <div class="why-box" style="background:var(--green-soft)">
              <div class="lab">Why</div>
              <div class="val">${esc(note)}</div>
            </div>` : ""}

          ${step.loop ? `<div class="muted">Repeat: ${esc(step.loop)}</div>` : ""}
          ${step.care ? `<div class="callout ${step.n === 9 ? "danger" : "warn"}"><div class="t">Care tip</div>${esc(step.care)}</div>` : ""}

          <div class="views">
            <div>
              <div class="tiny" style="margin-bottom:8px">Conversation</div>
              ${phoneHtml(chat, chatCaption)}
            </div>
            <div>
              <div class="tiny" style="margin-bottom:8px">What the team tracks</div>
              ${consoleHtml(consoleTitle, consoleRows)}
              ${step.sfLimit && tab === "opt1" ? `<div class="muted" style="margin-top:8px">Limit: ${esc(step.sfLimit)}</div>` : ""}
            </div>
          </div>
        </div>`;

      document.querySelectorAll(".step-btn").forEach((btn) => {
        btn.addEventListener("click", () => setStep(Number(btn.dataset.step)));
      });
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      if (prev) prev.addEventListener("click", () => setStep(STEPS[idx - 1].n));
      if (next) next.addEventListener("click", () => setStep(STEPS[idx + 1].n));
    }

    render();
  </script>
</body>
</html>
